# Violin configuration
# Override with a custom YAML via: --config my_config.yaml

# ── Models ──────────────────────────────────────────────────
models:
  transcription:
    provider: together                  # "together" | "openai"
    model: openai/whisper-large-v3      # together → openai/whisper-large-v3 | openai → whisper-1
  translation:
    provider: together                  # "together" | "openai"
    model: deepseek-ai/DeepSeek-V4-Pro  # together → deepseek-ai/DeepSeek-V4-Pro | openai → gpt-5.5
  tts:
    provider: together                  # "together" | "elevenlabs" | "openai" | "edge" | "supertonic"
    model: cartesia/sonic-3             # together → cartesia/sonic-3 | elevenlabs → eleven_v3 | openai → tts-1-hd | edge → edge-tts
  chat:
    provider: together                  # "together" | "openai" — must be vision-capable (sees sampled video frames)
    model: Qwen/Qwen3.5-397B-A17B       # together → Qwen/Qwen3.5-397B-A17B | openai → gpt-5.5

# ── Preferences ─────────────────────────────────────────────
# What to use when a request doesn't explicitly pick a style/voice.
preferences:
  style: "standard"      # "standard" | "kids" | "academic" | "casual" | "storyteller" | "news" — see prompts/styles.yaml
  voice_gender: "male"   # "male" | "female" — picks the default native voice

# Below: per-stage tuning knobs in pipeline execution order
# (audio extract → transcription → translation → tts → segment merge → video merge → api → chat)
# These ship tuned for the default stack — typical users don't need to touch
# anything past this line. Override them in a separate YAML loaded with --config.

# ── 1. Transcription ────────────────────────────────────────
transcription:
  chunk_seconds: 600   # split audio into chunks of this length (seconds) for Whisper
  parallel_workers: 2  # number of parallel Whisper API calls for chunked audio
  prefer_source_captions: true  # URL inputs: reuse the video's own captions (manual → auto+LLM punctuation) instead of Whisper when available
  max_sentence_seconds: 0   # >0: split ASR sentences longer than this at clause punctuation / silences (local presets: 12)
  min_piece_seconds: 2.5    # minimum length of a split-off piece

# ── 2. Translation ──────────────────────────────────────────
translation:
  batch_size: 64
  parallel_batches: 1  # >1 needs OLLAMA_NUM_PARALLEL≥N on the server (each slot costs KV cache)
  max_retries: 3
  temperature: 0.3
  response_format: json_schema   # json_schema (OpenAI/Together) | json_object (Ollama, vLLM — plain JSON mode)
  reasoning_effort: none         # ollama: "none" disables Gemma 4 / Qwen 3 hidden thinking (10× faster); openai_compat: sent only if set
                                  # null/empty for provider ollama re-enables hidden thinking
  # ASR correction hints — tell the LLM about known transcription errors so it can fix
  # them during translation. Format: "wrong → correct (context)".
  asr_corrections:
    - "03 → o3 (OpenAI model name, e.g. o3-mini)"
    - "04 → o4 (OpenAI model name, e.g. o4-mini)"
    - "01 → o1 (OpenAI model name)"

# ── 3. TTS ──────────────────────────────────────────────────
tts:
  workers: 8                        # parallel TTS API calls. Segments that get 429-throttled automatically fall back to serial, so this is safe even on entry-tier keys (just slower for those).
  tail_silence_ms: 120              # (ms) silence after segments ending in a comma / mid-clause break (keeps speech flowing)
  sentence_tail_silence_ms: 250     # (ms) silence after a sentence-ending mark (period/!?/。！？) — longer to feel natural

# ── 3b. Voice bank (fixed voices for zero-shot local TTS, e.g. vieneu) ──
voices:
  bank: "assets/voices/vi"   # directory with catalog.yaml + reference WAVs
  default_male: "Phạm Tuyên"   # VieNeu preset name or voice-bank name
  default_female: "Ngọc Huyền" # VieNeu preset name or voice-bank name

# ── 3b2. Diarization (sentence-level speaker labelling; off by default) ──
diarization:
  enabled: false
  backend: ecapa                         # "ecapa" (local, ECAPA embeddings + clustering) | "pyannote" (gated HF model)
  num_speakers: null                     # fixed speaker count, if known (skips threshold-based clustering)
  max_speakers: 4                        # cap on auto-detected speaker count
  threshold: 0.65                        # cosine-distance cut for agglomerative clustering (ecapa backend)
  model: speechbrain/spkrec-ecapa-voxceleb
  pyannote_model: pyannote/speaker-diarization-community-1
  device: auto

# ── 3c. VieNeu-TTS v3 Turbo (only used when models.tts.provider = vieneu) ──
vieneu:
  backend: auto              # auto (ONNX on CPU / PyTorch on CUDA) | onnx | pytorch
  precision: int8            # ONNX/CPU backbone: int8 (fast) | fp32 (max fidelity)
  device: auto
  threads: 0                 # ONNX intra-op threads, 0 = engine default
  max_batch_size: 32         # PyTorch/GPU static batching cap
  temperature: 0.8           # SDK recommendation for v3 Turbo
  top_k: 25
  top_p: 0.95
  repetition_penalty: 1.2
  watermark: true            # SDK audio watermark (apply_watermark)
  normalize_numbers: false   # VieNeu's own normalizer already reads digits/percent/acronyms (verified on GPU spike); enable only for odd inputs
  loanwords: {}              # optional pronunciation map, e.g. {"GPU": "gi pi u"}
  batch_tts: true            # use infer_batch (GPU static batching, ~6× faster TTS); ignored on CPU

# ── 4. Segment merging (combine Whisper fragments into sentences) ──
merge:
  max_gap: 1.0           # seconds — merge if gap between segments is smaller
  max_duration: 60.0     # seconds — never merge beyond this total length
  min_duration: 0.0      # seconds — glue same-speaker segments shorter than this to a neighbour (0 = off; local presets use 2.5)
  max_subtitle_chars: 20 # split sub-sentences longer than this at clause punctuation (、，；,;)

# ── 4b. Duration fitter (local dubbing; off by default) ─────
fit:
  enabled: false
  sec_per_syllable: 0.21      # seconds per Vietnamese syllable at TTS speed 1.0 — calibrate per voice (spike M0a)
  overrun_tolerance: 1.30     # ask the LLM to shorten only when est > budget × this
  max_shorten_rounds: 2
  max_pause_borrow_s: 0.6     # how much of the following pause a sentence may borrow
  margin_s: 0.05              # keep this gap before the next sentence's onset
  batch_chunk: 32   # units per synth_batch call (memory bound; VieNeu batches internally up to vieneu.max_batch_size)
  min_fill: 0.0  # >0: slow speech (atempo ≥ min_tempo, pitch kept) when a unit fills less than this share of its slot; presets 0.6
  min_tempo: 0.85
  pipelined: false  # translate batch N+1 while TTS batch N runs (two GPUs / GPU + CPU)

# ── 5. Video merge / alignment ──────────────────────────────
merge_video:
  workers: 16           # concurrent ffmpeg processes per job (each ~300MB RAM); raise this on slower instances via prod.yaml
  output_fps: 30
  min_gap: 0.05        # seconds — skip gap chunks shorter than this
  speed_clamp_min: 0.5
  speed_clamp_max: 2.5
  max_freeze_s: 0.2       # cap on frozen-frame duration when TTS is much longer than the speed-clamped video; beyond this the audio is sped up via atempo instead
  max_audio_speedup: 1.3  # ceiling on atempo applied to TTS to compensate for over-budget speech (1.0 = no speedup, 1.3 ≈ podcast 1.3×)
  hard_trim: false        # true: when speech still overruns after stretch+atempo, cut it at the slot (with fade) instead of freezing frames
  trim_fade_ms: 80        # fade-out length before the hard cut
  crf: 23
  preset: "ultrafast"
  voiceover_volume: 0.1  # 0.0–1.0 — original audio level for CLI voiceover mode

# ── 5b. Subtitles ───────────────────────────────────────────
subtitles:
  language: target       # target = translated text on the output timeline | source = original-language ASR sentences re-timed to the output video
  max_chars: 84          # per cue (≈ 2 lines × 42) when splitting source sentences into word-timed cues
  max_duration: 6.0      # seconds per cue
  min_duration: 1.0      # cues shorter than this are merged into the previous one when the text fits
  burn_style: "FontName=Arial,FontSize=22,Outline=2,Shadow=0,MarginV=28"   # ffmpeg subtitles force_style for --burn-subtitles

# ── 6. API server ───────────────────────────────────────────
api:
  jobs_dir: "jobs"
  max_workers: 4             # concurrent jobs (× merge_video.workers = total ffmpeg processes); lower on small instances via prod.yaml
  job_ttl_hours: 0           # auto-delete completed/failed jobs older than this hours (0 = disable; set in prod.yaml for public deployments)
  free_trial_jobs: 0         # free jobs per IP before requiring a user-provided API key (0 = BYOK-only)
  url_upload: true           # allow users to paste video URLs (yt-dlp); set false to disable
  max_duration_seconds: 0    # reject videos longer than this in seconds (0 = unlimited); set in prod.yaml
  max_file_size_mb: 0        # reject uploads larger than this in MB (0 = unlimited); set in prod.yaml

# ── 7. Video chat (post-job Q&A over dubbed video) ──────────
chat:
  context_window_seconds: 60
  frame_interval_seconds: 10
  max_frames: 6
  temperature: 0.2
  max_tokens: 512
