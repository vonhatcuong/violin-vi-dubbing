# Mac M-series preset — minimal cloud surface.
#
# STT  : faster-whisper local (Whisper Large v3, CTranslate2, int8 on CPU)
# LLM  : Ollama Cloud — DeepSeek V3.1 (671B MoE) for translation + chat
# TTS  : Edge-TTS Vietnamese neural voices
#
# Required env vars:
#   OLLAMA_API_KEY=...   (get from https://ollama.com/settings/keys)
#
# Run with:
#   uv sync --extra local
#   uv run main.py video.mp4 video_vi.mp4 --language Vietnamese --config config/local_mac.yaml

models:
  transcription:
    provider: faster-whisper
    model: large-v3-turbo                 # ~5× faster than large-v3, near-equivalent quality. Alternatives: large-v3 / medium / small / base
  translation:
    provider: ollama
    model: qwen3-next:80b       # Ollama Cloud DeepSeek V3.1 MoE
  tts:
    provider: edge
    model: edge-tts
  chat:
    provider: ollama                      # DeepSeek V3.1 is text-only — video Q&A will use captions only, no frame sampling
    model: qwen3-next:80b

# ── faster-whisper local tuning ─────────────────────────────
transcription:
  chunk_seconds: 600
  parallel_workers: 1                     # local Whisper saturates the CPU — keep serial
  local_device: auto                      # "auto" | "cpu" | "cuda" — auto picks CPU on Apple Silicon
  local_compute_type: auto                # "auto" | "int8" | "float16" | "float32" — int8 is the M-series sweet spot

# ── Translation tuning (smaller batches for Ollama Cloud) ───
translation:
  batch_size: 16                          # 64 default is too large for single 671B/large-MoE request — 16 gives ~30s/batch on flash, ~60s on full

# ── Supertonic local tuning (only used when models.tts.provider=supertonic) ──
supertonic:
  total_steps: 8                          # 5 (low) … 12 (high) quality, default 8
  speed: 1.0                              # natural speed; two_pass_tts.py overrides per-segment when needed
  inject_breath: false                    # no breath/emotion tags — user prefers clean natural voice

# ── TTS workers — keep conservative for Edge-TTS and local providers ───
tts:
  workers: 1
  tail_silence_ms: 120
  sentence_tail_silence_ms: 250

# ── Video alignment — HYBRID mode (Approach A from opensource survey) ───
# Allow video to slow down up to 8% per segment to absorb Vietnamese inflation
# without freeze frames (AutoDub-style per-segment stretch). atempo still
# kicks in for the residual; freeze is a last resort.
merge_video:
  speed_clamp_min: 0.92                   # video may slow to 92% of original (frame stretch) to absorb Vi overrun
  speed_clamp_max: 1.0                    # NEVER speed video above original — keep frames 1:1 with source
  max_audio_speedup: 1.4                  # gentle atempo only — TTS is already pre-sped via supertonic.speed=1.3
  max_freeze_s: 0.0                       # NO freeze frames
  voiceover_volume: 0.02                  # original audio bed under dub — 2%
