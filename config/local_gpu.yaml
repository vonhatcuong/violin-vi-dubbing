# NVIDIA GPU preset — FULLY LOCAL. Same stages as local_mac.yaml on CUDA.
# Tested on Vast.ai 2× RTX 3090: Ollama on one GPU, ASR/TTS on the other.
#   nvidia-smi -L                     # list each card's stable UUID, e.g. GPU-1a2b3c4d..., GPU-5e6f7a8b...
#   CUDA_VISIBLE_DEVICES=GPU-<uuid-A> OLLAMA_CONTEXT_LENGTH=8192 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_FLASH_ATTENTION=1 OLLAMA_KEEP_ALIVE=30m OLLAMA_NUM_PARALLEL=2 ollama serve
#     (without OLLAMA_CONTEXT_LENGTH Ollama defaults gemma4:31b to a 262k context and spills half the model to CPU → 3 tok/s)
#     (OLLAMA_KEEP_ALIVE=30m keeps the 19 GB model resident between pipeline stages instead of a cold reload after 5 min idle)
#     (select cards by UUID, not index — on two identical cards, index 0/1 can be assigned in a different
#      order to each process, putting Ollama and VieNeu/faster-whisper on the same GPU and causing OOM)
#   uv sync --extra local-gpu
#   uv pip install "torch==2.8.0" "torchaudio==2.8.0" --index-url https://download.pytorch.org/whl/cu128   # VieNeu GPU engine
#   ollama pull gemma4:31b            # Q4, ~19 GB — fits a 24 GB card
#   CUDA_VISIBLE_DEVICES=GPU-<uuid-B> uv run main.py video.mp4 video_vi.mp4 --language Vietnamese --config config/local_gpu.yaml

models:
  transcription:
    provider: faster-whisper
    model: large-v3
  translation:
    provider: ollama                    # or: openai_compat + base_url: http://localhost:8000/v1 (vLLM)
    model: gemma4:31b
    base_url: http://localhost:11434/v1
  tts:
    provider: vieneu
    model: vieneu-v3-turbo
  chat:
    provider: ollama
    model: gemma4:31b
    base_url: http://localhost:11434/v1

transcription:
  chunk_seconds: 600
  parallel_workers: 2                    # two whisper chunks concurrently on the GPU (validated on run #3)
  local_device: cuda
  local_compute_type: float16
  max_sentence_seconds: 12               # split run-on ASR sentences at clause punctuation / silences

translation:
  batch_size: 32
  parallel_batches: 2
  response_format: json_object

merge:
  max_subtitle_chars: 0
  min_duration: 2.5
  max_duration: 15                      # sentence-sized units: run-on lecture speech otherwise yields 15–20 s units and coarse sync

fit:
  enabled: true
  sec_per_syllable: 0.22
  min_fill: 0.6                         # VieNeu speaks faster than the lecturer (~73 % measured fill); slow under-filled units gently
  pipelined: true

vieneu:
  backend: auto                         # → PyTorch batched engine on CUDA
  device: cuda
  max_batch_size: 32

voices:
  default_male: "Thanh Bình"
  default_female: "Ngọc Huyền"
  gender_detect: true    # guess each diarized speaker's gender from F0 (GPU has headroom; use with --speakers auto/N)

tts:
  workers: 1
  tail_silence_ms: 120
  sentence_tail_silence_ms: 250

merge_video:
  workers: 16
  speed_clamp_min: 0.92
  speed_clamp_max: 1.0
  max_audio_speedup: 1.4
  max_freeze_s: 0.0
  hard_trim: true
  voiceover_volume: 0.02

subtitles:
  language: source                      # English subtitles under the Vietnamese dub, timed to the output video
